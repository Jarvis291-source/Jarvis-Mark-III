name: Claude Original UI Compile Review

on:
  workflow_dispatch:
  push:
    paths:
      - 'claude-review/2.4.0-original/**'
      - '.github/workflows/claude-original-review.yml'

jobs:
  typecheck-original-claude-code:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck unchanged Claude Swift files
        run: |
          set -o pipefail
          xcrun swiftc -typecheck \
            claude-review/2.4.0-original/JarvisVisualState.swift \
            claude-review/2.4.0-original/JarvisVoiceController.swift \
            claude-review/2.4.0-original/JarvisBackgroundView.swift \
            claude-review/2.4.0-original/JarvisCoreView.swift \
            claude-review/2.4.0-original/JarvisModuleView.swift \
            claude-review/2.4.0-original/JarvisWorkspaceView.swift \
            claude-review/2.4.0-original/JarvisHUDView.swift \
            claude-review/2.4.0-original/JarvisMainContainer.swift \
            -framework SwiftUI -framework AppKit -framework AVFoundation
