name: Validate Swift Sources

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Parse all Jarvis Swift sources
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            echo "Parsing $file"
            swiftc -parse "$file"
            found=1
          done < <(find releases -name '*.swift' -print0)
          test "$found" -eq 1
