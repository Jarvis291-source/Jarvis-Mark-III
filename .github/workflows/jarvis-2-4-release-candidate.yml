name: Jarvis 2.4 Release Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'release-candidate/2.4.0/JarvisZero.swift'
      - '.github/workflows/jarvis-2-4-release-candidate.yml'

jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact single-file updater payload
        run: |
          set -o pipefail
          mkdir -p /tmp/jarvis24rc
          xcrun swiftc release-candidate/2.4.0/JarvisZero.swift \
            -o /tmp/jarvis24rc/JarvisZero \
            -framework SwiftUI -framework AppKit -framework AVFoundation -framework Speech
          test -x /tmp/jarvis24rc/JarvisZero
          codesign --force --deep --sign - /tmp/jarvis24rc/JarvisZero
          codesign --verify --verbose /tmp/jarvis24rc/JarvisZero
          shasum -a 256 release-candidate/2.4.0/JarvisZero.swift
