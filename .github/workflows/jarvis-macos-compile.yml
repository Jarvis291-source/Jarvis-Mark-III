name: Jarvis macOS Compile Check

on:
  push:
    branches: [main]
    paths:
      - 'releases/**/JarvisZero.swift'
      - '.github/workflows/jarvis-macos-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: xcrun swiftc --version
      - name: Compile Jarvis 2.4.0
        run: |
          xcrun swiftc -parse-as-library releases/2.4.0/JarvisZero.swift \
            -o /tmp/JarvisZero \
            -framework SwiftUI \
            -framework AppKit \
            -framework AVFoundation \
            -framework Speech
          test -x /tmp/JarvisZero

      - name: Multi-file SwiftUI HUD smoke test
        run: |
          set -euo pipefail
          rm -rf /tmp/JarvisHUDSmoke
          mkdir -p /tmp/JarvisHUDSmoke
          cat > /tmp/JarvisHUDSmoke/Main.swift <<'SWIFT'
          import SwiftUI
          @main struct HUDSmokeApp: App {
              var body: some Scene {
                  WindowGroup { HUDSmokeView() }
              }
          }
          SWIFT
          cat > /tmp/JarvisHUDSmoke/HUD.swift <<'SWIFT'
          import SwiftUI
          struct HUDSmokeView: View {
              var body: some View {
                  ZStack {
                      Color.black
                      TimelineView(.animation(minimumInterval: 1.0 / 30.0)) { timeline in
                          let t = timeline.date.timeIntervalSinceReferenceDate
                          Circle()
                              .stroke(.cyan.opacity(0.8), lineWidth: 2)
                              .frame(width: 240, height: 240)
                              .rotationEffect(.degrees(t * 18))
                      }
                      HStack {
                          HUDModule(title: "SYSTEM")
                          HUDModule(title: "CLAUDE")
                      }
                  }
                  .frame(minWidth: 800, minHeight: 600)
              }
          }
          struct HUDModule: View {
              let title: String
              var body: some View {
                  Text(title)
                      .padding()
                      .background(.cyan.opacity(0.08))
                      .overlay(RoundedRectangle(cornerRadius: 8).stroke(.cyan.opacity(0.4)))
              }
          }
          SWIFT
          xcrun swiftc -parse-as-library             /tmp/JarvisHUDSmoke/Main.swift             /tmp/JarvisHUDSmoke/HUD.swift             -o /tmp/JarvisHUDSmoke/JarvisHUDSmoke             -framework SwiftUI             -framework AppKit
          test -x /tmp/JarvisHUDSmoke/JarvisHUDSmoke

      - name: Compile actual split developer workspace
        run: |
          set -euo pipefail
          rm -rf /tmp/JarvisSplitWorkspace
          mkdir -p /tmp/JarvisSplitWorkspace/Sources/Core /tmp/JarvisSplitWorkspace/Sources/UI
          python3 - <<'PY'
          from pathlib import Path
          source = Path("releases/2.4.0/JarvisZero.swift").read_text()
          markers = ["\n\n// ===== JarvisVisualState.swift =====", "\n\nstruct ArcRing: View {"]
          marker = next((m for m in markers if m in source), None)
          assert marker is not None, "UI split marker missing"
          core, ui = source.split(marker, 1)
          Path("/tmp/JarvisSplitWorkspace/Sources/Core/JarvisCore.swift").write_text(core.strip() + "\n")
          Path("/tmp/JarvisSplitWorkspace/Sources/UI/JarvisHUD.swift").write_text(
              "import SwiftUI\nimport AppKit\nimport Foundation\nimport Combine\n\n" + marker.lstrip() + ui
          )
          PY
          xcrun swiftc -parse-as-library             /tmp/JarvisSplitWorkspace/Sources/Core/JarvisCore.swift             /tmp/JarvisSplitWorkspace/Sources/UI/JarvisHUD.swift             -o /tmp/JarvisSplitWorkspace/JarvisZero             -framework SwiftUI             -framework AppKit             -framework AVFoundation             -framework Speech
          test -x /tmp/JarvisSplitWorkspace/JarvisZero
