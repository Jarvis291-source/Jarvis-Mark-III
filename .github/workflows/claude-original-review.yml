name: Claude Original UI Compile Review

on:
  workflow_dispatch:
  push:
    paths:
      - 'claude-review/2.4.0-original/**'
      - '.github/workflows/claude-original-review.yml'

jobs:
  voice:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -typecheck claude-review/2.4.0-original/JarvisVisualState.swift claude-review/2.4.0-original/JarvisVoiceController.swift -framework SwiftUI -framework AVFoundation
  background:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -typecheck claude-review/2.4.0-original/JarvisVisualState.swift claude-review/2.4.0-original/JarvisBackgroundView.swift -framework SwiftUI
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -typecheck claude-review/2.4.0-original/JarvisVisualState.swift claude-review/2.4.0-original/JarvisCoreView.swift -framework SwiftUI
  module:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -typecheck claude-review/2.4.0-original/JarvisVisualState.swift claude-review/2.4.0-original/JarvisModuleView.swift -framework SwiftUI
  workspace:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -typecheck claude-review/2.4.0-original/JarvisVisualState.swift claude-review/2.4.0-original/JarvisWorkspaceView.swift -framework SwiftUI
  all-original:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun swiftc -typecheck claude-review/2.4.0-original/*.swift -framework SwiftUI -framework AppKit -framework AVFoundation
