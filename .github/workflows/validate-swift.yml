name: Validate Current Swift Source

on:
  push:
    branches: [main]
    paths:
      - 'releases/2.1.3/JarvisZero.swift'
      - '.github/workflows/validate-swift.yml'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Parse current Jarvis source
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse releases/2.1.3/JarvisZero.swift
